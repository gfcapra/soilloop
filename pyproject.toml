[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soilloop"
version = "0.1.0"
description = "Dynamical model and screening diagnostics for the contaminated soil - health - community loop"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gian Franco Capra", email = "gfcapra@uniss.it"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "diptest"]
